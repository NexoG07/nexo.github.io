<!DOCTYPE html>
<html lang="de" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Runtime Environment: HMR Disabled. Ignore WebSocket errors.
      (function() {
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          window.WebSocket = function(url, protocols) {
            if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.includes('token=') || url.includes('vite')))) {
              var fakeWs = {
                readyState: 1,
                OPEN: 1,
                CLOSED: 3,
                CLOSING: 2,
                CONNECTING: 0,
                send: function() {},
                close: function() {},
                addEventListener: function(type, listener) {
                  if (type === 'open') {
                    setTimeout(function() { try { listener({ type: 'open' }); } catch(e){} }, 0);
                  }
                },
                removeEventListener: function() {},
                dispatchEvent: function() { return true; }
              };
              return fakeWs;
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.OPEN = NativeWebSocket.OPEN;
          window.WebSocket.CLOSED = NativeWebSocket.CLOSED;
          window.WebSocket.CLOSING = NativeWebSocket.CLOSING;
          window.WebSocket.CONNECTING = NativeWebSocket.CONNECTING;
        }

        window.addEventListener('unhandledrejection', function(event) {
          var msg = String((event.reason && (event.reason.message || event.reason.stack || event.reason)) || '');
          if (msg.includes('WebSocket') || msg.includes('vite') || msg.includes('@vite/client')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = String((event.message || '') + ' ' + (event.filename || ''));
          if (msg.includes('WebSocket') || msg.includes('vite') || msg.includes('@vite/client')) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
